name: Optimize portfolio images

on:
  push:
    paths:
      - ".github/workflows/optimize-portfolio-images.yml"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  optimize:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: npm install --no-save sharp
      - run: node scripts/optimize-portfolio-images.mjs
      - run: node scripts/apply-performance-fixes.mjs
      - name: Commit optimized assets and markup
        run: |
          git config user.name "webdotme-image-bot"
          git config user.email "actions@users.noreply.github.com"
          git add assets/portfolio assets/site-core.css assets/site.css index.html work/little-lute-studio/index.html work/washington-benefits-group/index.html
          if git diff --cached --quiet; then
            echo "No performance changes"
          else
            git commit -m "Optimize portfolio image delivery"
            git push
          fi
